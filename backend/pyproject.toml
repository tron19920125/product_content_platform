[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "product-content-platform"
version = "0.1.0"
description = "Local-first product content production and QA platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pillow>=11,<13",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
